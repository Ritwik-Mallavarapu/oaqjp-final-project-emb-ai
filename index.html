<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dad and Dude Repair</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Login - Dad and Dude Repair</h1>
    </header>
    <nav>
        <ul class="nav justify-content-center bg-dark">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Login</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="dashboard.php">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="training.php">Training Modules</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="ai_assistance.php">AI Repair Assistance</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="feedback.php">Feedback</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Login</h1>
        <form action="php/login.php" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="mt-3">Don't have an account? <a href="register.html">Register here</a>.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            let message = '';
            let messageType = 'info'; // 'info', 'success', 'danger'

            if (status === 'inactive_logout') {
                message = 'You have been logged out due to inactivity.';
                messageType = 'warning';
            } else if (status === 'logged_out') { // For explicit logout link if we add one
                message = 'You have been successfully logged out.';
                messageType = 'success';
            } else if (status === 'not_logged_in') {
                message = 'You need to log in to access that page.';
                messageType = 'danger';
            } else if (status === 'login_failed') { // If login.php redirects here on failure
                 message = 'Login failed. Please check your username and password.';
                 messageType = 'danger';
            } else if (status === 'admin_access_denied') {
                message = 'Access Denied: You do not have permission to view that page. Please log in as an owner.';
                messageType = 'danger';
            }


            if (message) {
                const alertContainer = document.createElement('div');
                alertContainer.className = `alert alert-${messageType} alert-dismissible fade show`;
                alertContainer.setAttribute('role', 'alert');
                alertContainer.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                `;
                // Prepend to the main container or form
                const mainContainer = document.querySelector('.container') || document.querySelector('form');
                if (mainContainer) {
                    mainContainer.prepend(alertContainer);
                } else {
                    document.body.prepend(alertContainer); // Fallback
                }
            }
        });
    </script>
</body>
</html>
